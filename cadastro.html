<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro — Arquivo Sombrio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24162e, #09070d 60%);
    color: #eee;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 430px;

    background: rgba(20, 16, 25, .96);

    border: 1px solid #5e376e;
    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 0 40px rgba(125, 55, 160, .2);
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 14px;

    margin-bottom: 15px;

    background: #0e0b12;
    color: white;

    border: 1px solid #4d3657;
    border-radius: 9px;

    outline: none;
}

input:focus {
    border-color: #9d58c2;
}

button {
    width: 100%;
    padding: 14px;

    border: 0;
    border-radius: 9px;

    background: #743d91;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #8d4fad;
}

.link {
    text-align: center;
    margin-top: 20px;
}

a {
    color: #c67bea;
}

#mensagem {
    text-align: center;
    margin-top: 15px;
}

.erro {
    color: #ff6b6b;
}

.sucesso {
    color: #69e391;
}

</style>
</head>

<body>

<div class="container">

    <h1>☾ Criar Conta</h1>

    <div class="subtitle">
        ARQUIVO SOMBRIO RPG
    </div>

    <input
        id="nome"
        type="text"
        placeholder="Nome"
    >

    <input
        id="email"
        type="email"
        placeholder="E-mail"
    >

    <input
        id="senha"
        type="password"
        placeholder="Senha"
    >

    <input
        id="confirmarSenha"
        type="password"
        placeholder="Confirmar senha"
    >

    <button id="btnCadastro">
        CRIAR CONTA
    </button>

    <div id="mensagem"></div>

    <div class="link">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </div>

</div>

<script type="module">

import {
    auth,
    db,
    createUserWithEmailAndPassword,
    doc,
    setDoc,
    serverTimestamp
} from "./firebase.js";

const nome = document.getElementById("nome");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const confirmar = document.getElementById("confirmarSenha");
const mensagem = document.getElementById("mensagem");

document.getElementById("btnCadastro").onclick = async () => {

    mensagem.className = "";
    mensagem.textContent = "";

    if (!nome.value.trim() ||
        !email.value.trim() ||
        !senha.value) {

        mensagem.className = "erro";
        mensagem.textContent = "Preencha todos os campos.";
        return;
    }

    if (senha.value.length < 6) {

        mensagem.className = "erro";
        mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

        return;
    }

    if (senha.value !== confirmar.value) {

        mensagem.className = "erro";
        mensagem.textContent =
            "As senhas não são iguais.";

        return;
    }

    try {

        const credencial =
            await createUserWithEmailAndPassword(
                auth,
                email.value,
                senha.value
            );

        const usuario = credencial.user;

        await setDoc(
            doc(db, "usuarios", usuario.uid),
            {
                uid: usuario.uid,
                nome: nome.value.trim(),
                email: usuario.email,
                dataCriacao: serverTimestamp()
            }
        );

        await setDoc(
            doc(db, "fichas", usuario.uid),
            {
                nome: nome.value.trim(),
                idade: "",
                nivel: 1,
                profissao: "",
                origemMagia: "Sem magia",

                experiencia: 0,

                personalidade: "",
                historia: "",
                objetivo: "",
                medo: "",

                PVMax: 10,
                PVAtual: 10,

                sanidadeMax: 10,
                sanidadeAtual: 10,

                defesa: 10,
                adaptacao: 0,

                atributos: {
                    FOR: 0,
                    AGI: 0,
                    VIG: 0,
                    INT: 0,
                    PER: 0,
                    VON: 0
                },

                habilidades: "",
                poderes: "",
                precoPacto: "",
                equipamentos: "",

                armas: []
            }
        );

        mensagem.className = "sucesso";
        mensagem.textContent =
            "Conta criada! Entrando...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1000);

    } catch (erro) {

        mensagem.className = "erro";

        if (erro.code === "auth/email-already-in-use") {
            mensagem.textContent =
                "Este e-mail já possui uma conta.";
        }

        else if (erro.code === "auth/invalid-email") {
            mensagem.textContent =
                "E-mail inválido.";
        }

        else {
            mensagem.textContent =
                "Erro ao criar conta: " + erro.message;
        }
    }
};

</script>

</body>
</html>
